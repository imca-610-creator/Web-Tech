<!DOCTYPE html>
<html lang="en">

<head>
    <title>Image Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        h2 {
            color: #333;
            margin-top: 20px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 30px;
        }

        .gallery img {
            width: 220px;
            height: 150px;
            border: 3px solid #555;
            border-radius: 10px;
            object-fit: cover;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.1);
            border-color: blue;
        }
    </style>

</head>

<body>

    <h2>CSS Image Gallery</h2>

    <div class="gallery">

        <img src="C:\Users\SCMS\Desktop\610\4.css image/images.jfif" alt="Image 1">

        <img src="C:\Users\SCMS\Desktop\610\4.css image/images (1).jfif" alt="Image 2">

        <img src="C:\Users\SCMS\Desktop\610\4.css image/images (2).jfif" alt="Image 3">

        <img src="C:\Users\SCMS\Desktop\610\4.css image/images (3).jfif" alt="Image 4">

    </div>

</body>

</html>
